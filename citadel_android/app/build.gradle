plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jasontsk.projectcitadel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jasontsk.projectcitadel'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'com.jasontsk.projectcitadel.CrownforgeInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
