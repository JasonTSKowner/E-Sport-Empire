name: Nexora AI Android

on:
  push:
    branches:
      - nexora-models-v14
    paths:
      - 'nexora_android/**'
      - '.github/workflows/build-nexora-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: nexora_android
        run: gradle :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp nexora_android/app/build/outputs/apk/debug/app-debug.apk nexora_android/app/build/outputs/apk/debug/Nexora-AI-v1.4-models.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-AI-v1.4-models
          path: nexora_android/app/build/outputs/apk/debug/Nexora-AI-v1.4-models.apk
          if-no-files-found: error
