name: Build Club Dynasty APK

on:
  push:
    branches:
      - club-dynasty-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Rebuild and unpack Club Dynasty source
        run: |
          rm -rf ClubDynasty_v0_1 /tmp/clubdynasty-source.*
          cat club_dynasty_source.b64.part00 club_dynasty_source.b64.part01 club_dynasty_source.b64.part02 club_dynasty_source.b64.part03 > /tmp/clubdynasty-source.b64
          base64 --decode /tmp/clubdynasty-source.b64 > /tmp/clubdynasty-source.zip
          echo "922a72b574ebea91db4464b21f3cc638aeb72ce23fa8bdb4e04e82c5c0312b48  /tmp/clubdynasty-source.zip" | sha256sum -c -
          test "$(stat -c%s /tmp/clubdynasty-source.zip)" = "10028"
          unzip -q /tmp/clubdynasty-source.zip
          test -f ClubDynasty_v0_1/project.godot

      - name: Fix Godot Android project compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('ClubDynasty_v0_1/scripts/main.gd')
          s = script.read_text()
          replacements = {
              'var elapsed := clamp(now - previous, 0, 28800)': 'var elapsed: int = clampi(now - previous, 0, 28800)',
              'var ovr := clamp(base + randi_range(-4, 7), 55, 88)': 'var ovr: int = clampi(base + randi_range(-4, 7), 55, 88)',
              'var potential := clamp(ovr + randi_range(3, 18) - max(0, age - 24), ovr, 94)': 'var potential: int = clampi(ovr + randi_range(3, 18) - maxi(0, age - 24), ovr, 94)',
              'var pos := positions.pick_random()': 'var pos: String = str(positions.pick_random())',
              'var atk := clamp(ovr + randi_range(-10, 10), 40, 92)': 'var atk: int = clampi(ovr + randi_range(-10, 10), 40, 92)',
              'var pas := clamp(ovr + randi_range(-10, 10), 40, 92)': 'var pas: int = clampi(ovr + randi_range(-10, 10), 40, 92)',
              'var pace := clamp(ovr + randi_range(-10, 10), 40, 94)': 'var pace: int = clampi(ovr + randi_range(-10, 10), 40, 94)',
              'var deff := clamp(ovr + randi_range(-10, 10), 35, 92)': 'var deff: int = clampi(ovr + randi_range(-10, 10), 35, 92)',
              'var phy := clamp(ovr + randi_range(-10, 10), 40, 92)': 'var phy: int = clampi(ovr + randi_range(-10, 10), 40, 92)',
              'var count := min(11, players.size())': 'var count: int = mini(11, players.size())',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected source line: {old}')
              s = s.replace(old, new)
          script.write_text(s)

          project = Path('ClubDynasty_v0_1/project.godot')
          p = project.read_text()
          android_texture_setting = 'rendering/textures/vram_compression/import_etc2_astc=true'
          if android_texture_setting not in p:
              anchor = 'textures/default_filters/use_nearest_mipmap_filter=false'
              if anchor not in p:
                  raise SystemExit('Could not locate [rendering] texture settings in project.godot')
              p = p.replace(anchor, anchor + '\n' + android_texture_setting)
          project.write_text(p)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Install Android Gradle build template
        run: |
          mkdir -p ClubDynasty_v0_1/android/plugins
          mkdir -p ClubDynasty_v0_1/android/build
          touch ClubDynasty_v0_1/android/build/.gdignore
          printf '4.3.stable\n' > ClubDynasty_v0_1/android/.build_version
          unzip -q "$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip" -d ClubDynasty_v0_1/android/build
          test -f ClubDynasty_v0_1/android/build/gradlew
          chmod +x ClubDynasty_v0_1/android/build/gradlew

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/clubdynasty-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Club Dynasty,C=DE" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/shutdown_adb_on_exit = true
          export/android/force_system_user = false
          export/android/debug_keystore = "$GITHUB_WORKSPACE/clubdynasty-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.3.tres" "$HOME/.config/godot/editor_settings-4.tres"

      - name: Create Android export preset
        run: |
          cat > ClubDynasty_v0_1/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/ClubDynasty-v0.1.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="0.1"
          package/unique_name="com.jasontskowner.clubdynasty"
          package/name="Club Dynasty"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=true
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=true
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""
          permissions/custom_permissions=PackedStringArray()
          permissions/internet=false
          permissions/vibrate=false
          xr_features/hand_tracking=0
          xr_features/hand_tracking_frequency=0
          xr_features/passthrough=0
          EOF

      - name: Import project and check scripts
        run: |
          godot --headless --editor --path ClubDynasty_v0_1 --quit-after 1

      - name: Export installable APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/clubdynasty-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path ClubDynasty_v0_1 --export-debug Android "$GITHUB_WORKSPACE/build/ClubDynasty-v0.1.apk"
          test -s build/ClubDynasty-v0.1.apk
          ls -lh build/ClubDynasty-v0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClubDynasty-v0.1-APK
          path: build/ClubDynasty-v0.1.apk
          if-no-files-found: error
          retention-days: 7
