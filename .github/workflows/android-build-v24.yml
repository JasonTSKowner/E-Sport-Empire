name: Build Android APK v2.4

on:
  push:
    branches: [v2.4-visual-rebuild]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-v24-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-android:
    name: Godot 4 Android v2.4
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Restore persistent Android signing identity
        uses: actions/cache@v4
        with:
          path: .android-signing
          key: e-sport-empire-android-signing-v1

      - name: Create signing identity if needed
        shell: bash
        run: |
          mkdir -p .android-signing
          if [ ! -f .android-signing/e-sport-empire.keystore ]; then
            PASS="$(openssl rand -hex 24)"
            printf "%s" "$PASS" > .android-signing/password.txt
            keytool -genkeypair -noprompt \
              -keystore .android-signing/e-sport-empire.keystore \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -alias esportempire \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=E-Sport Empire Alpha,O=TSK,C=DE"
          fi

      - name: Install Godot test runtime
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/godot-runtime.zip
          mkdir -p /tmp/godot-runtime
          unzip -q /tmp/godot-runtime.zip -d /tmp/godot-runtime
          chmod +x /tmp/godot-runtime/Godot_v4.7.2-stable_linux.x86_64

      - name: Import Godot resources
        shell: bash
        run: |
          timeout --signal=TERM 90s \
            /tmp/godot-runtime/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path . --import

      - name: Run ranked and mobile smoke test
        shell: bash
        run: |
          sed -i 's/AppConfigRef.VERSION.begins_with("2.0.")/AppConfigRef.VERSION.begins_with("2.4.")/' tests/smoke_test.gd
          timeout --signal=TERM 45s \
            /tmp/godot-runtime/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path . --script res://tests/smoke_test.gd

      - name: Run v2.2 compatibility smoke test
        shell: bash
        run: |
          sed -i 's/\["2.2.0", "2.3.0"\]/["2.2.0", "2.3.0", "2.4.0", "2.4.3"]/' tests/v22_smoke_test.gd
          timeout --signal=TERM 45s \
            /tmp/godot-runtime/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path . --script res://tests/v22_smoke_test.gd

      - name: Run v2.3 compatibility smoke test
        shell: bash
        run: |
          sed -i 's/ChangelogData.CURRENT_VERSION == "2.3.0"/ChangelogData.CURRENT_VERSION in ["2.3.0", "2.4.0", "2.4.3"]/' tests/v23_smoke_test.gd
          sed -i 's/AppConfig.VERSION.begins_with("2.3.")/AppConfig.VERSION.begins_with("2.4.")/' tests/v23_smoke_test.gd
          timeout --signal=TERM 60s \
            /tmp/godot-runtime/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path . --script res://tests/v23_smoke_test.gd

      - name: Run v2.4 visual rebuild smoke test
        shell: bash
        run: |
          timeout --signal=TERM 60s \
            /tmp/godot-runtime/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path . --script res://tests/v24_visual_smoke_test.gd

      - name: Capture mobile UI reference screens
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/ui-captures
          xvfb-run -a \
            /tmp/godot-runtime/Godot_v4.7.2-stable_linux.x86_64 \
            --path . --script res://tests/ui_capture.gd

      - name: Upload UI reference screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E-Sport-Empire-v2.4-UI-Captures
          path: build/ui-captures/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Import and export Godot project
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          use_preset_export_path: true
          presets_to_export: Android
          cache: true
          verbose: true

      - name: Sign APK with persistent identity
        shell: bash
        run: |
          APK="$(find build -type f -name '*.apk' | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          PASS="$(cat .android-signing/password.txt)"
          "$APKSIGNER" sign \
            --ks .android-signing/e-sport-empire.keystore \
            --ks-key-alias esportempire \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: E-Sport-Empire-v2.4-Android
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 30
