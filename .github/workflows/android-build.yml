name: Build Android APK

on:
  push:
    branches: [main, v0.4-mobile-polish, v0.4.1-rl-mmr, v0.4.2-rl-ranked-core, v0.4.3-hotfix-mobile]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-android:
    name: Godot 4 Android Debug
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # GitHub's runner already includes the SDK packages Godot needs.
          # The action's legacy default also requests the removed `tools`
          # package, so skip that extra package installation.
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Restore persistent Android signing identity
        uses: actions/cache@v4
        with:
          path: .android-signing
          key: e-sport-empire-android-signing-v1

      - name: Create signing identity if needed
        shell: bash
        run: |
          mkdir -p .android-signing
          if [ ! -f .android-signing/e-sport-empire.keystore ]; then
            PASS="$(openssl rand -hex 24)"
            printf "%s" "$PASS" > .android-signing/password.txt
            keytool -genkeypair -noprompt               -keystore .android-signing/e-sport-empire.keystore               -storepass "$PASS"               -keypass "$PASS"               -alias esportempire               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=E-Sport Empire Alpha,O=TSK,C=DE"
          fi

      - name: Import and export Godot project
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          use_preset_export_path: true
          presets_to_export: Android
          cache: true
          verbose: true

      - name: Sign APK with persistent identity
        shell: bash
        run: |
          APK="$(find build -type f -name '*.apk' | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          PASS="$(cat .android-signing/password.txt)"
          "$APKSIGNER" sign             --ks .android-signing/e-sport-empire.keystore             --ks-key-alias esportempire             --ks-pass "pass:$PASS"             --key-pass "pass:$PASS"             "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: E-Sport-Empire-Android
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 30
