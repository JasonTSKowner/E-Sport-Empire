name: Build Relic Ascension v0.9 Nexus Reforged

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relic-v0.9-vfx-gear-core-rework

      - name: Generate Nexus Reforged content pack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 relic_v05/tools/generate_colossus_assets.py
          du -sh relic_v05/assets
          find relic_v05/assets/visual/v09 -type f -maxdepth 2 -printf '%p %k KB\n' | sort || true

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout 25s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path relic_v05 2>&1 | tee /tmp/runtime.log
          code=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|ERROR:|Parse Error|Invalid|Cannot" /tmp/runtime.log; then
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

      - name: Prepare Android preset
        shell: bash
        run: |
          cat > relic_v05/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/RelicAscension-v0.9-Nexus-Reforged.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=10
          version/name="0.9.0-nexus-reforged"
          package/unique_name="com.tsk.relicascension.nexusreforged"
          package/name="Relic Ascension Nexus Reforged"
          package/signed=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/internet=false
          EOF

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Export APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: relic_v05/
          export_debug: true
          use_preset_export_path: true
          presets_to_export: Android
          cache: true

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/relicsign
          keytool -genkeypair -noprompt -keystore /tmp/relicsign/key.jks -storepass android -keypass android -alias relic -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Relic Ascension,O=TSK,C=DE"
          APK="$(find relic_v05/build -type f -name '*.apk' | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign --ks /tmp/relicsign/key.jks --ks-key-alias relic --ks-pass pass:android --key-pass pass:android "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"
          stat -c '%s' "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Relic-Ascension-v0.9-Nexus-Reforged-APK
          path: relic_v05/build/**/*.apk
          if-no-files-found: error
          retention-days: 7
