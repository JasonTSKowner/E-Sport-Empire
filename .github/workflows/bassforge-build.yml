name: Build BassForge EQ V6.0.2 Unsigned Release

on:
  push:
    branches:
      - chatgpt/bassforge-apk-v1

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35 packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build unsigned release APK
        working-directory: bassforge
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Collect unsigned APK
        shell: bash
        run: |
          APK="bassforge/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          cp "$APK" "BassForge-EQ-v6.0.2-UNSIGNED.apk"
          ls -lh "BassForge-EQ-v6.0.2-UNSIGNED.apk"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: BassForge-EQ-v6.0.2-UNSIGNED-APK
          path: BassForge-EQ-v6.0.2-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 7

      - name: Collect apksigner tool
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$APKSIGNER"
          JAR="$(dirname "$APKSIGNER")/lib/apksigner.jar"
          test -f "$JAR"
          cp "$JAR" apksigner.jar
          ls -lh apksigner.jar

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-35
          path: apksigner.jar
          if-no-files-found: error
          retention-days: 7
