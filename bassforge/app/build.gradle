plugins {
    id "com.android.application"
}

android {
    namespace "com.bassforge.eq"
    compileSdk 35

    defaultConfig {
        applicationId "com.bassforge.eq"
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName "6.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
